# meta-flood: flood forecaster application, bitstreams and kernel options for
# the ZYBO + topann design, for the AMD EDF (Yocto Project) flow.
BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "flood"
BBFILE_PATTERN_flood = "^${LAYERDIR}/"
BBFILE_PRIORITY_flood = "10"

LAYERDEPENDS_flood = "core"
# EDF 26.11 (AMD 2026.2) is based on Wrynose. UNPACKDIR (used by the recipes)
# needs Styhead or newer.
LAYERSERIES_COMPAT_flood = "styhead walnascar whinlatter wrynose"

# Root of the AI-flood-prediction-system repository (this layer lives in
# <repo>/Yocto/meta-flood). Recipes take their sources from there.
FLOOD_REPO_DIR := "${@os.path.normpath(os.path.join(d.getVar('LAYERDIR'), '..', '..'))}"
