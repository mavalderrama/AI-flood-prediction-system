# topann accelerator: user-space register access through UIO, runtime PL
# programming through the Zynq-7000 FPGA Manager, /dev/mem for bring-up.
CONFIG_UIO=y
# Module, so its of_id option comes from /etc/modprobe.d (no bootargs needed).
CONFIG_UIO_PDRV_GENIRQ=m
CONFIG_FPGA=y
CONFIG_FPGA_MGR_ZYNQ_FPGA=y
CONFIG_DEVMEM=y
